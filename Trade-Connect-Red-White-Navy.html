function t(k){return dict[state.lang][k]||dict.ar[k]||k}

function stat(label,val,icon,sub){return `<div class="stat"><div class="stat-head"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${val}</strong><small class="up">${sub}</small></div>`}

function offerCards(){return state.offers.map(o=>`<div class="offer-card"><div class="offer-top"><div class="supplier"><div class="supplier-logo">${o.supplier.slice(0,2).toUpperCase()}</div><div><b>${o.supplier} ${o.verified?'<span style="color:#16856a">✓</span>':''}</b><small>${o.country} · ★ ${o.rating}</small></div></div><div class="price">${money(o.price)}<small> / إجمالي العرض</small></div></div><div class="offer-foot"><span>⏱ ${o.lead} · MOQ ${o.moq}</span><button class="text-link" data-compare="${o.id}">${t('details')} ←</button></div></div>`).join('')}

<div><div class="panel"><div class="panel-head"><div><h3>${t('activity')}</h3><p>آخر التحديثات على حسابك</p></div></div><div class="activity"><i class="activity-dot"></i><div><b>وصل عرض سعر جديد</b><small>Anatolia Foods Export · منذ 25 دقيقة</small></div></div><div class="activity"><i class="activity-dot"></i><div><b>تم تحديث حالة الطلب ORD-0062</b><small>بانتظار تأكيد الاتفاقية · أمس</small></div></div><div class="activity"><i class="activity-dot"></i><div><b>تم التحقق من مورد جديد</b><small>Ege Natural Products · 05 نوفمبر</small></div></div></div>

function suppliersPage(){return `<div class="welcome"><div><div class="eyebrow">SUPPLIER DIRECTORY</div><h1>${t('suppliers')}</h1><p>اكتشف شركات ومصانع تركية ضمن بيانات تجريبية.</p></div></div><div class="panel">${[['Anatolia Foods Export','أغذية وزيوت','إزمير، تركيا','4.9'],['Ege Natural Products','منتجات طبيعية','مانيسا، تركيا','4.8'],['Istanbul Pro Kitchen','معدات مطاعم','إسطنبول، تركيا','4.7']].map((s,i)=>`<div class="request-row"><div class="supplier-logo">${s[0].slice(0,2).toUpperCase()}</div><div class="request-info"><b>${s[0]} <span class="pill green">${t('verified')}</span></b><small>${s[1]} · ${s[2]}</small></div><b>★ ${s[3]}</b><button class="btn btn-outline" data-chat="${s[0]}">تواصل</button></div>`).join('')}</div>`}
function productsPage(){return `<div class="welcome"><div><div class="eyebrow">PRODUCT CATALOG</div><h1>${t('products')}</h1><p>فئات ومنتجات استرشادية للعرض التجريبي.</p></div></div><div class="compare-grid">${[['🫒','الأغذية والمشروبات','زيوت، معلبات، منتجات غذائية'],['🪑','الأثاث والتجهيزات','أثاث مكتبي وفندقي'],['◻️','مواد البناء','سيراميك، بورسلان، أدوات صحية'],['⚙️','المعدات الصناعية','معدات وخطوط إنتاج'],['🧵','المنسوجات','أقمشة، ملابس، مفروشات'],['💡','الإضاءة والكهرباء','إنارة ومستلزمات كهربائية']].map(x=>`<div class="compare"><div class="stat-icon">${x[0]}</div><h4>${x[1]}</h4><p>${x[2]}</p><button class="text-link" data-goto="requests">استكشف الطلبات ←</button></div>`).join('')}</div>`}
function settingsPage(){return `<div class="welcome"><div><div class="eyebrow">PREFERENCES</div><h1>${t('settings')}</h1><p>إعدادات العرض التجريبي وتبديل نوع الحساب.</p></div></div><div class="panel"><h3>تجربة الأدوار</h3><p class="muted">يمكنك التبديل بين الأدوار لمراجعة الواجهات. هذا التبديل تجريبي وليس نظام صلاحيات حقيقياً.</p><div class="steps"><button class="btn btn-outline" data-role="buyer">Buyer · مشتري</button><button class="btn btn-outline" data-role="supplier">Supplier · مورد</button><button class="btn btn-outline" data-role="admin">Admin · إدارة</button></div></div><div class="panel"><h3>بيانات المشروع</h3><p>Trade Connect · Bahrain ↔ Türkiye</p><p class="muted">نسخة Prototype محلية ببيانات توضيحية.</p></div>`}

function localizeMarkup(markup){
 if(state.lang==='ar') return markup;
 const map=uiTranslations[state.lang]||{};
 const keys=Object.keys(map).sort((x,y)=>y.length-x.length);
 for(const k of keys) markup=markup.split(k).join(map[k]);
 return markup;
}

function render(){header();let views={overview,requests:requestsPage,offers:offersPage,messages:messagesPage,orders:ordersPage,shipping:shippingPage,payments:paymentsPage,suppliers:suppliersPage,products:productsPage,settings:settingsPage};$('#content').innerHTML=localizeMarkup((views[state.page]||overview)());bind()}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function modal(title,subtitle,body,actions=''){ $('#modal').innerHTML=`<h3>${title}</h3><p>${subtitle}</p>${body}${actions}`;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function requestForm(){modal(t('newRequestTitle'),'أدخل بيانات الطلب. سيتم حفظه محلياً في هذا النموذج فقط.',`<form id="requestForm" class="form-grid"><div class="field full"><label>${t('productName')} *</label><input name="product" required placeholder="مثال: زيت زيتون بكر ممتاز"></div><div class="field"><label>${t('category')}</label><select name="category"><option>أغذية ومشروبات</option><option>مواد بناء</option><option>أثاث وتجهيزات</option><option>معدات صناعية</option><option>منسوجات</option></select></div><div class="field"><label>${t('quantity')} *</label><input name="qty" required placeholder="مثال: 2,000 لتر"></div><div class="field"><label>${t('destination')}</label><input name="destination" value="المنامة، البحرين"></div><div class="field"><label>${t('budget')}</label><input name="budget" placeholder="BHD"></div><div class="field"><label>${t('deadline')}</label><input name="deadline" type="date"></div><div class="field full"><label>${t('specs')}</label><textarea name="specs" placeholder="المواصفات، الجودة، التعبئة، الشهادات المطلوبة..."></textarea></div><div class="field full"><label>مرفقات توضيحية (ميزة تجريبية لاحقاً)</label><input type="file" disabled><small class="muted">رفع الملفات سيتم تفعيله عند ربط التخزين السحابي.</small></div></form>`,`<div class="form-actions"><button class="btn btn-outline" id="cancelModal">${t('cancel')}</button><button class="btn btn-primary" id="saveRequest">${t('save')}</button></div>`)}
function compareModal(){modal(t('compareTitle'),'عرض تجريبي — الأسعار بالدينار البحريني.',`<div class="compare-grid">${state.offers.map(o=>`<div class="compare"><h4>${o.supplier}</h4><span class="pill ${o.verified?'green':'amber'}">${o.verified?t('verified'):'غير موثّق'}</span><div class="big">${money(o.price)}</div><p>التجهيز: ${o.lead}</p><p>الحد الأدنى: ${o.moq}</p><p>التقييم: ★ ${o.rating}</p><button class="btn btn-primary" data-accept="${o.id}">${t('accept')}</button></div>`).join('')}</div>`)}
function bind(){
  ['newRequest','newRequest2'].forEach(id=>{let e=$('#'+id);if(e)e.onclick=requestForm});
  let ca=$('#compareAll');if(ca)ca.onclick=compareModal;
  $$('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
  $$('[data-compare]').forEach(b=>b.onclick=compareModal);
  $$('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;toast('تم التبديل إلى '+b.textContent+' (عرض تجريبي)');render()});
  $$('[data-ship]').forEach(b=>b.onclick=()=>toast('تم تسجيل اختيار الشحن تجريبياً: '+b.dataset.ship));
  $$('[data-chat]').forEach(b=>b.onclick=()=>toast('واجهة المحادثة التجريبية مع '+b.dataset.chat+' — الربط الفعلي لاحقاً'));
  let save=$('#saveRequest');if(save)save.onclick=()=>{let f=$('#requestForm');if(!f.reportValidity())return;let d=new FormData(f);state.requests.unshift({id:'TC-'+Math.floor(24019+Math.random()*900),name:d.get('product'),category:d.get('category'),qty:d.get('qty'),destination:d.get('destination')||'غير محدد',offers:0,status:'قيد المراجعة',date:new Date().toLocaleDateString('ar-BH'),icon:'📦'});closeModal();state.page='requests';render();toast('تم حفظ طلب الشراء في النموذج التجريبي')};
  let cancel=$('#cancelModal');if(cancel)cancel.onclick=closeModal;
  $$('[data-accept]').forEach(b=>b.onclick=()=>{let o=state.offers.find(x=>x.id===b.dataset.accept);if(!o)return;modal('تأكيد اختيار العرض','هذا إجراء تجريبي لا ينشئ عقداً ملزماً.',`<div class="notice">المورد: ${o.supplier}<br>قيمة العرض: ${money(o.price)}<br>سيتم إنشاء سجل طلب تجريبي فقط.</div>`,`<div class="form-actions"><button class="btn btn-outline" id="cancelModal">رجوع</button><button class="btn btn-primary" id="confirmAccept">تأكيد تجريبي</button></div>`);$('#cancelModal').onclick=closeModal;$('#confirmAccept').onclick=()=>{state.orders.unshift({id:'ORD-0063',product:o.product,supplier:o.supplier,amount:o.price,status:'بانتظار الاتفاقية',date:new Date().toLocaleDateString('ar-BH')});closeModal();state.page='orders';render();toast('تم إنشاء طلب تجريبي جديد') }});
  let sim=$('#simulatePayment');if(sim)sim.onclick=()=>toast('محاكاة فقط: لم يتم إرسال أي طلب إلى بوابة دفع أو تحصيل أموال');
  let search=$('#requestSearch');if(search)search.oninput=()=>{$$('#requestTable tr').forEach(r=>r.style.display=r.textContent.includes(search.value)?'':'none')};
}
function go(p){state.page=p;render();$('#sidebar').classList.remove('open')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$$('.sidebar [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
$('#language').onchange=e=>{state.lang=e.target.value;document.documentElement.lang=state.lang;document.body.dir=state.lang==='ar'?'rtl':'ltr';render()};
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
render();

</script>
